name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # the same versions that go into the Windows zip (build/build_windows_zip.sh)
      - name: Instalar dependências
        run: python -m pip install --quiet "pandas==3.0.6" "numpy==2.5.4" "openpyxl==3.1.5" "dbfread==2.0.7" pytest
      - name: Rodar os testes
        run: python -m pytest tests/ -q

      # the printable manual must build on every change to docs/MANUAL.md or to the converter; the PDF is kept as an artifact
      - name: Manual em PDF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation fonts-dejavu-core
          python -m pip install --quiet "markdown==3.11.2" "weasyprint==70.0"
          python build/build_manual_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          path: build/dist/MANUAL_anotador_sinan_v*.pdf
          retention-days: 30
