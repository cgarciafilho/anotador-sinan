name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # the same versions that go into the Windows zip (build/build_windows_zip.sh)
      - name: Instalar dependências
        run: python -m pip install --quiet "pandas==3.0.6" "numpy==2.5.4" "openpyxl==3.1.5" "dbfread==2.0.7" pytest
      - name: Rodar os testes
        run: python -m pytest tests/ -q
