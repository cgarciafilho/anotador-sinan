# On a tag vX.Y.Z: check that the tag matches __version__, run the tests, build the Windows zip and open a DRAFT release
# with the zip and its sha256. Publishing the draft is a manual step (it is what triggers Zenodo, when linked).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Conferir que a tag é a versão do código
        run: |
          V="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sinan_anotador/__init__.py)"
          echo "tag=$GITHUB_REF_NAME  __version__=$V"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "ERRO: a tag não bate com __version__"; exit 1; }
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "ERRO: CHANGELOG.md não tem a seção ## [$V]"; exit 1; }

      - name: Instalar dependências e rodar os testes
        run: |
          python -m pip install --quiet "pandas==3.0.6" "numpy==2.5.4" "openpyxl==3.1.5" "dbfread==2.0.7" pytest
          python -m pytest tests/ -q

      - name: Montar o zip para Windows
        run: build/build_windows_zip.sh

      - name: Soma de verificação
        run: |
          cd build/dist
          sha256sum anotador_sinan_v*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notas do release a partir do CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "**Como usar:** baixe \`anotador_sinan_v${V}.zip\`, descompacte em qualquer pasta e arraste os arquivos .DBF do Sinan NET sobre \`anotar.bat\`. Não precisa instalar nada. Detalhes no \`LEIA-ME.txt\` dentro do zip."
            echo
            echo "**Conferência:** sha256 em \`SHA256SUMS.txt\`."
          } >> notes.md
          cat notes.md

      - name: Criar o release (rascunho)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "anotador SINAN $GITHUB_REF_NAME" --notes-file notes.md \
            build/dist/anotador_sinan_v*.zip build/dist/SHA256SUMS.txt
