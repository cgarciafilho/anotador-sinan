# Builds the Windows zip and opens a DRAFT release with it and its sha256, for the version in src/sinan_anotador/__init__.py.
# Two ways in: push of a tag vX.Y.Z (the tag must equal __version__), or manual dispatch on a branch (then the draft targets that
# commit and GitHub creates the tag vX.Y.Z when the draft is published). Publishing the draft is always a manual step: it is
# what triggers Zenodo, when linked. If a release for the version already exists, the job stops without touching it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Versão, tag e CHANGELOG
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sinan_anotador/__init__.py)"
          TAG="v$V"
          echo "evento=$GITHUB_EVENT_NAME ref=$GITHUB_REF_NAME  __version__=$V"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "ERRO: a tag $GITHUB_REF_NAME não bate com __version__ $V"; exit 1; fi
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "ERRO: CHANGELOG.md não tem a seção ## [$V]"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe (rascunho ou publicado): nada a fazer."; echo "existe=1" >> "$GITHUB_OUTPUT"
          else
            echo "existe=0" >> "$GITHUB_OUTPUT"; fi
          echo "versao=$V" >> "$GITHUB_OUTPUT"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências e rodar os testes
        if: steps.v.outputs.existe == '0'
        run: |
          python -m pip install --quiet "pandas==3.0.6" "numpy==2.5.4" "openpyxl==3.1.5" "dbfread==2.0.7" pytest
          python -m pytest tests/ -q

      - name: Montar o zip para Windows
        if: steps.v.outputs.existe == '0'
        run: build/build_windows_zip.sh

      - name: Soma de verificação
        if: steps.v.outputs.existe == '0'
        run: |
          cd build/dist
          sha256sum anotador_sinan_v*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notas do release a partir do CHANGELOG
        if: steps.v.outputs.existe == '0'
        run: |
          V="${{ steps.v.outputs.versao }}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "**Como usar:** baixe \`anotador_sinan_v${V}.zip\`, descompacte em qualquer pasta e arraste os arquivos .DBF do Sinan NET sobre \`anotar.bat\`. Não precisa instalar nada. Detalhes no \`LEIA-ME.txt\` dentro do zip."
            echo
            echo "**Conferência:** sha256 em \`SHA256SUMS.txt\`."
          } >> notes.md
          cat notes.md

      - name: Criar o release (rascunho)
        if: steps.v.outputs.existe == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "anotador SINAN $TAG" --notes-file notes.md \
            build/dist/anotador_sinan_v*.zip build/dist/SHA256SUMS.txt
